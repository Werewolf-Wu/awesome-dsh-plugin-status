name: Sync plugin status

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1

      - name: Record base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Sync snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync.py --output-dir .

      - name: Publish single-commit snapshot
        run: bash scripts/publish.sh "${{ steps.base.outputs.sha }}"
